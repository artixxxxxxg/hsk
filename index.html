.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btns button{border:0;border-radius:16px;padding:18px 0;font-size:16px;font-weight:600;color:#fff;font-family:inherit;cursor:pointer;opacity:.35}
.btns.act button{opacity:1}
.btns button.sug{outline:3px solid var(--fg);outline-offset:2px}
#bn{background:var(--no)}#bu{background:var(--mid)}#bk{background:var(--ok)}
#chk{background:var(--accent);color:#fff}
.small{background:none;border:0;color:var(--mute);font-size:13px;text-decoration:underline;font-family:inherit;cursor:pointer}

  cv.addEventListener("lostpointercapture",()=>{pen=null});
  cv.addEventListener("pointerleave",e=>{if(hov(e))pen=null});
}else{
  // Fallback для старых мобильных браузеров без Pointer Events
  const touchPoint=e=>{const t=e.changedTouches[0],b=cv.getBoundingClientRect();return[(t.clientX-b.left)/cell,(t.clientY-b.top)/cell]};
  cv.addEventListener("touchstart",e=>{if(!cur||checked)return;e.preventDefault();begin(touchPoint(e))},{passive:false});
  cv.addEventListener("touchmove",e=>{if(!pen)return;e.preventDefault();lastP=touchPoint(e);pen.push(lastP);redraw()},{passive:false});
  cv.addEventListener("touchend",()=>{pen=null},{passive:true});
  cv.addEventListener("touchcancel",()=>{pen=null},{passive:true});
}
addEventListener("keydown",e=>{if(e.code==="Space"&&cfg.hover&&cur&&!checked){e.preventDefault();if(pen)pen=null;else begin(lastP)}});
$("undo").onclick=()=>{if(checked)return;strokes.pop();redraw()};
$("clr").onclick=()=>{strokes=[];checked=false;res=null;render()};
$("hnt").onclick=()=>{hint=!hint;redraw()};
$("snd").onclick=()=>{try{const u=new SpeechSynthesisUtterance(cur[1]);u.lang="zh-CN";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
$("chk").onclick=()=>{
  if(!cur)return;
  if(checked){strokes=[];checked=false;res=null;render();return}
  check();checked=true;render();
};
function answer(s){
  if(!cur||!checked)return;
  const c=queue.shift();st[key(c)]=s;saveS();
  if(s===cfg.view)queue.push(c);
  next();
}
$("bk").onclick=()=>answer("k");$("bu").onclick=()=>answer("u");$("bn").onclick=()=>answer("n");
$("skip").onclick=()=>{if(cur){queue.push(queue.shift());next()}};
$("toNew").onclick=()=>{if(!cur)return;const c=queue.shift();delete st[key(c)];saveS();next()};
$("reset").onclick=()=>{if(confirm("Сбросить весь прогресс?")){st={};saveS();start()}};
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(layout,120)});if(window.visualViewport)visualViewport.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(layout,120)});
start();
try{const mq=matchMedia("(prefers-color-scheme:dark)");if(mq.addEventListener)mq.addEventListener("change",redraw);else if(mq.addListener)mq.addListener(redraw)}catch(e){}
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
